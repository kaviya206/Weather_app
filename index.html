<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Weather</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts (Nunito for a cute, rounded look) -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Cute pastel background */
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
        }

        .cute-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 3rem;
            box-shadow: 0 20px 40px -10px rgba(166, 193, 238, 0.5);
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating animations for cute cartoons */
        .float-slow { animation: float 6s ease-in-out infinite; }
        .float-med { animation: float 4.5s ease-in-out infinite; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(4deg); }
        }

        .search-results-dropdown {
            max-height: 200px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #F472B6 transparent;
        }
        
        .search-results-dropdown::-webkit-scrollbar {
            width: 6px;
        }
        
        .search-results-dropdown::-webkit-scrollbar-thumb {
            background-color: #F472B6;
            border-radius: 20px;
        }
    </style>
</head>
<body id="app-body" class="min-h-screen flex items-center justify-center p-4 text-slate-700 relative overflow-hidden">

    <!-- Cute Cartoon Background Elements -->
    <!-- Smiling Sun -->
    <div class="absolute top-12 left-12 md:top-24 md:left-32 float-slow z-0">
        <svg viewBox="0 0 100 100" class="w-24 h-24 md:w-32 md:h-32 drop-shadow-xl opacity-90">
            <circle cx="50" cy="50" r="25" fill="#FFD166"/>
            <path d="M 50,15 L 50,5 M 50,95 L 50,85 M 15,50 L 5,50 M 95,50 L 85,50 M 25,25 L 18,18 M 75,75 L 82,82 M 25,75 L 18,82 M 75,25 L 82,18" stroke="#FFD166" stroke-width="6" stroke-linecap="round"/>
            <circle cx="42" cy="45" r="3" fill="#475569"/>
            <circle cx="58" cy="45" r="3" fill="#475569"/>
            <path d="M 45,55 Q 50,62 55,55" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>
            <circle cx="36" cy="50" r="4" fill="#FF9F1C" opacity="0.4"/>
            <circle cx="64" cy="50" r="4" fill="#FF9F1C" opacity="0.4"/>
        </svg>
    </div>

    <!-- Smiling Cloud -->
    <div class="absolute bottom-12 right-12 md:bottom-24 md:right-32 float-med z-0">
        <svg viewBox="0 0 120 80" class="w-28 h-28 md:w-40 md:h-40 drop-shadow-xl opacity-90">
            <path d="M 30,60 a 20,20 0 0,1 0,-40 a 25,25 0 0,1 55,-10 a 20,20 0 0,1 5,35 a 15,15 0 0,1 -5,25 z" fill="white" />
            <circle cx="50" cy="45" r="3" fill="#475569"/>
            <circle cx="70" cy="45" r="3" fill="#475569"/>
            <path d="M 55,52 Q 60,58 65,52" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>
            <circle cx="42" cy="48" r="4" fill="#F472B6" opacity="0.5"/>
            <circle cx="78" cy="48" r="4" fill="#F472B6" opacity="0.5"/>
        </svg>
    </div>

    <!-- Smiling Star -->
    <div class="absolute top-20 right-20 float-slow z-0 hidden md:block">
        <svg viewBox="0 0 100 100" class="w-16 h-16 drop-shadow-lg opacity-80">
             <path d="M 50,10 L 61,35 L 88,39 L 68,58 L 73,85 L 50,73 L 27,85 L 32,58 L 12,39 L 39,35 Z" fill="#FDE047"/>
             <circle cx="44" cy="55" r="2.5" fill="#475569"/>
             <circle cx="56" cy="55" r="2.5" fill="#475569"/>
             <path d="M 47,60 Q 50,65 53,60" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
    </div>

    <main class="cute-card w-full max-w-md p-6 md:p-10 relative overflow-visible fade-in z-10 mx-4 flex flex-col min-h-[500px]">
        
        <!-- Notification Area -->
        <div id="notification" class="absolute top-0 left-0 w-full bg-pink-400/90 text-white text-sm font-bold text-center py-3 px-4 transition-transform duration-300 -translate-y-full backdrop-blur-md rounded-t-[2.5rem] z-50">
            <!-- Message goes here -->
        </div>

        <!-- Search Bar -->
        <div class="relative w-full mb-6 z-40">
            <div class="relative flex items-center">
                <i data-lucide="search" class="absolute left-4 w-5 h-5 text-slate-400"></i>
                <input type="text" id="city-search" placeholder="Search for a city... (e.g. Madurai)" 
                    class="w-full bg-white/70 border-2 border-white/80 rounded-full py-3 pl-12 pr-12 text-slate-700 font-bold placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-pink-300/50 focus:bg-white transition-all shadow-sm">
                <button id="clear-search" class="absolute right-4 w-5 h-5 text-slate-400 hover:text-pink-500 hidden transition-colors">
                    <i data-lucide="x-circle" class="w-5 h-5"></i>
                </button>
                <div id="search-spinner" class="absolute right-4 w-5 h-5 text-pink-400 hidden">
                    <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                </div>
            </div>
            
            <!-- Autocomplete Results -->
            <ul id="search-results" class="search-results-dropdown absolute top-full left-0 w-full mt-2 bg-white/95 backdrop-blur-xl border-2 border-white rounded-2xl shadow-xl hidden z-50 flex-col py-2 opacity-0 transition-opacity duration-200">
                <!-- Results will be injected here -->
            </ul>
        </div>

        <!-- Content Wrapper to handle loading state swapping -->
        <div class="relative flex-grow flex flex-col justify-center w-full">
            
            <!-- Default Content / Weather Info -->
            <div id="weather-content" class="w-full flex flex-col transition-opacity duration-300">
                <!-- Header: Date and Greeting -->
                <header class="mb-6 text-center">
                    <p id="current-date" class="text-sm md:text-base font-bold opacity-70 uppercase tracking-widest mb-1 text-pink-500">
                        <!-- Date placeholder -->
                        Loading date...
                    </p>
                    <h1 id="greeting" class="text-2xl md:text-3xl font-extrabold leading-tight text-slate-700">
                        <!-- Greeting placeholder -->
                        Hello!
                    </h1>
                    <p id="sub-greeting" class="text-sm opacity-70 mt-1 font-semibold">
                        Let's see what the weather looks like.
                    </p>
                </header>

                <!-- Main Weather Display -->
                <section id="weather-container" class="flex flex-col items-center justify-center transition-opacity duration-500 opacity-0">
                    
                    <!-- Weather Emoji -->
                    <div class="mb-2 drop-shadow-xl relative">
                        <div id="weather-emoji" class="text-[5rem] md:text-[6rem] leading-none drop-shadow-md hover:scale-110 transition-transform duration-300 cursor-default">
                            🌤️
                        </div>
                    </div>
                    
                    <!-- Temperature -->
                    <div class="flex items-start justify-center mb-1 text-slate-700">
                        <span id="temperature" class="text-[4rem] md:text-[5rem] font-black tracking-tighter drop-shadow-sm">--</span>
                        <span class="text-2xl md:text-3xl font-bold mt-3 md:mt-4 opacity-80 text-pink-400">°C</span>
                    </div>
                    
                    <!-- Condition Description -->
                    <h2 id="condition-text" class="text-lg md:text-xl font-bold tracking-wide mb-4 text-slate-600 text-center">
                        Fetching weather...
                    </h2>
                    
                    <!-- Location -->
                    <div class="flex items-center space-x-2 bg-white/60 rounded-full py-2 px-5 backdrop-blur-sm border-2 border-white drop-shadow-sm">
                        <i data-lucide="map-pin" class="w-4 h-4 text-pink-500"></i>
                        <span id="location-text" class="text-sm font-bold text-slate-600 truncate max-w-[200px]">
                            Locating you...
                        </span>
                        <!-- Button to return to current location -->
                        <button id="btn-my-location" class="ml-2 text-slate-400 hover:text-pink-500 transition-colors" title="Use my current location">
                            <i data-lucide="navigation" class="w-4 h-4"></i>
                        </button>
                    </div>
                </section>
            </div>

            <!-- Loading Spinner -->
            <div id="loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center bg-white/40 backdrop-blur-sm z-10 transition-opacity duration-300 rounded-[2rem]">
                <i data-lucide="loader-2" class="w-10 h-10 animate-spin text-pink-400 mb-4"></i>
                <p class="text-sm font-bold text-slate-600">Checking the skies...</p>
            </div>
        </div>

    </main>

    <script>
        // DOM Elements
        const bodyEl = document.getElementById('app-body');
        const dateEl = document.getElementById('current-date');
        const greetingEl = document.getElementById('greeting');
        const subGreetingEl = document.getElementById('sub-greeting');
        const tempEl = document.getElementById('temperature');
        const conditionEl = document.getElementById('condition-text');
        const locationEl = document.getElementById('location-text');
        const weatherContainer = document.getElementById('weather-container');
        const weatherContent = document.getElementById('weather-content');
        const loadingSpinner = document.getElementById('loading-spinner');
        const notificationEl = document.getElementById('notification');
        const weatherEmojiEl = document.getElementById('weather-emoji');
        
        // Search Elements
        const searchInput = document.getElementById('city-search');
        const searchResultsEl = document.getElementById('search-results');
        const clearSearchBtn = document.getElementById('clear-search');
        const searchSpinner = document.getElementById('search-spinner');
        const myLocationBtn = document.getElementById('btn-my-location');

        // State variables
        let searchTimeout;
        let currentUserLat = null;
        let currentUserLon = null;

        // Default Location (Madurai)
        const DEFAULT_LAT = 9.9252;
        const DEFAULT_LON = 78.1198;

        // WMO Weather Code Mapping (Mapped to Cute Emojis)
        const weatherCodes = {
            0: ['Sunny skies!', '☀️'],
            1: ['Mostly sunny!', '🌤️'],
            2: ['Partly cloudy!', '⛅'],
            3: ['Cloudy!', '☁️'],
            45: ['A bit foggy!', '🌫️'],
            48: ['Frosty fog!', '🌫️❄️'],
            51: ['Light drizzles!', '🌧️'],
            53: ['Drizzling!', '🌧️'],
            55: ['Heavy drizzle!', '🌧️'],
            56: ['Freezing drizzle!', '🌧️❄️'],
            57: ['Dense freezing drizzle!', '🌧️❄️'],
            61: ['Light rain!', '☔'],
            63: ['Raining!', '☔'],
            65: ['Heavy rain!', '🌧️☔'],
            66: ['Freezing rain!', '🌧️❄️'],
            67: ['Heavy freezing rain!', '🌧️❄️'],
            71: ['Light snow!', '🌨️'],
            73: ['Snowing!', '❄️'],
            75: ['Heavy snow!', '❄️⛄'],
            77: ['Snow grains!', '🌨️'],
            80: ['Light showers!', '🌦️'],
            81: ['Showers!', '🌦️'],
            82: ['Heavy showers!', '🌧️'],
            85: ['Snow showers!', '🌨️'],
            86: ['Heavy snow showers!', '❄️'],
            95: ['Thunderstorm!', '⛈️'],
            96: ['Thunderstorm & hail!', '⛈️❄️'],
            99: ['Heavy thunderstorm & hail!', '⛈️❄️']
        };

        function updateDateTimeAndGreeting() {
            const now = new Date();
            const hour = now.getHours();
            
            // Format Date
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            dateEl.textContent = now.toLocaleDateString('en-US', options);

            // Determine Time of Day and Greeting with Kaomojis
            let greeting = "";
            let subGreeting = "";

            if (hour >= 5 && hour < 12) {
                greeting = "Good morning, Kaviya! ( ๑>ᴗ<๑ )";
                subGreeting = "Have a super cute day!";
            } else if (hour >= 12 && hour < 17) {
                greeting = "Good afternoon, Kaviya! ૮ ˶ᵔ ᵕ ᵔ˶ ა";
                subGreeting = "Hope you're smiling today.";
            } else if (hour >= 17 && hour < 21) {
                greeting = "Good evening, Kaviya! ( ˘ ³˘)♥";
                subGreeting = "Time for cozy vibes.";
            } else {
                greeting = "Good night, Kaviya! (ᴗ˳ᴗ)";
                subGreeting = "Sweet dreams and rest well.";
            }

            greetingEl.textContent = greeting;
            subGreetingEl.textContent = subGreeting;
        }

        function showNotification(message) {
            notificationEl.textContent = message;
            notificationEl.classList.remove('-translate-y-full');
            setTimeout(() => {
                notificationEl.classList.add('-translate-y-full');
            }, 3000); // Hide after 3 seconds
        }

        function showLoading(message = "Checking the skies...") {
            loadingSpinner.querySelector('p').textContent = message;
            loadingSpinner.style.display = 'flex';
            weatherContent.style.opacity = '0.5';
            
            // Allow display:flex to render before fading in
            requestAnimationFrame(() => {
                loadingSpinner.style.opacity = '1';
            });
        }

        function hideLoading() {
            loadingSpinner.style.opacity = '0';
            weatherContent.style.opacity = '1';
            setTimeout(() => {
                loadingSpinner.style.display = 'none';
            }, 300);
        }

        async function searchCities(query) {
            try {
                // Using Open-Meteo Geocoding API (Free, no key)
                const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=en&format=json`);
                if (!response.ok) throw new Error("Network response was not ok");
                const data = await response.json();
                return data.results || [];
            } catch (error) {
                console.error("Error searching cities:", error);
                return [];
            }
        }

        async function fetchCityName(lat, lon) {
            try {
                // Using BigDataCloud for free client-side reverse geocoding
                const response = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                const data = await response.json();
                return data.city || data.locality || data.principalSubdivision || "Unknown Location";
            } catch (error) {
                console.error("Error fetching city name:", error);
                return "Current Location";
            }
        }

        async function fetchWeather(lat, lon) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day`;
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error("Failed to fetch weather data");
                }
                const data = await response.json();
                return data.current;
            } catch (error) {
                console.error("Error fetching weather:", error);
                throw error;
            }
        }

        async function updateWeatherUI(lat, lon, locationName = null, isFallback = false) {
            showLoading("Floating there... 🎈");
            
            try {
                // Fetch data
                const weatherData = await fetchWeather(lat, lon);
                
                // If location name wasn't provided (e.g. from GPS), fetch it
                if (!locationName) {
                    locationName = await fetchCityName(lat, lon);
                }

                // Update UI elements
                tempEl.textContent = Math.round(weatherData.temperature_2m);
                
                const weatherInfo = weatherCodes[weatherData.weather_code] || ['Unknown weather', '🌈'];
                let conditionName = weatherInfo[0];
                let emojiIcon = weatherInfo[1];

                if (weatherData.is_day === 0) {
                    if (emojiIcon === '☀️') emojiIcon = '🌙';
                    if (emojiIcon === '🌤️' || emojiIcon === '⛅') emojiIcon = '☁️🌙';
                }

                conditionEl.textContent = conditionName;
                locationEl.textContent = locationName + (isFallback ? ' (Default)' : '');

                if (weatherEmojiEl) {
                    weatherEmojiEl.textContent = emojiIcon;
                }

                hideLoading();
                weatherContainer.style.opacity = '1';

            } catch (error) {
                console.error(error);
                showNotification("Oopsie! Couldn't get the weather there.");
                hideLoading();
                conditionEl.textContent = "Data unavailable 🥺";
                weatherContainer.style.opacity = '1';
            }
        }

        function renderSearchResults(results) {
            searchResultsEl.innerHTML = '';
            
            if (results.length === 0) {
                searchResultsEl.innerHTML = '<li class="px-4 py-3 text-sm text-slate-500 text-center font-semibold">No magical places found ✨</li>';
            } else {
                results.forEach(city => {
                    const li = document.createElement('li');
                    li.className = 'px-4 py-3 hover:bg-pink-50 cursor-pointer flex flex-col transition-colors border-b border-pink-50 last:border-0';
                    
                    // Format region string nicely
                    let regionInfo = [];
                    if (city.admin1) regionInfo.push(city.admin1);
                    if (city.country) regionInfo.push(city.country);
                    
                    li.innerHTML = `
                        <span class="font-bold text-slate-700">${city.name}</span>
                        <span class="text-xs text-slate-400 font-semibold mt-0.5">${regionInfo.join(', ')}</span>
                    `;
                    
                    li.addEventListener('click', () => {
                        // Clear search UI
                        searchInput.value = '';
                        closeSearchResults();
                        clearSearchBtn.classList.add('hidden');
                        
                        // Formatted name for the pill
                        const displayName = `${city.name}${city.country ? ', ' + city.country_code : ''}`;
                        
                        updateWeatherUI(city.latitude, city.longitude, displayName);
                    });
                    
                    searchResultsEl.appendChild(li);
                });
            }
            
            searchResultsEl.classList.remove('hidden');
            // Small delay to allow display block to apply before animating opacity
            requestAnimationFrame(() => {
                searchResultsEl.classList.remove('opacity-0');
            });
        }

        function closeSearchResults() {
            searchResultsEl.classList.add('opacity-0');
            setTimeout(() => {
                searchResultsEl.classList.add('hidden');
            }, 200); // matches transition duration
        }

        // Setup Search Input Listener
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            
            // Toggle clear button
            if (query.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }

            clearTimeout(searchTimeout);

            if (query.length < 2) {
                closeSearchResults();
                searchSpinner.classList.add('hidden');
                return;
            }

            // Show spinner
            clearSearchBtn.classList.add('hidden');
            searchSpinner.classList.remove('hidden');

            // Debounce API calls
            searchTimeout = setTimeout(async () => {
                const results = await searchCities(query);
                
                searchSpinner.classList.add('hidden');
                clearSearchBtn.classList.remove('hidden');
                
                renderSearchResults(results);
            }, 500); // 500ms debounce
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            closeSearchResults();
            searchInput.focus();
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResultsEl.contains(e.target)) {
                closeSearchResults();
            }
        });

        // Handle "My Location" button click
        myLocationBtn.addEventListener('click', () => {
            if (currentUserLat && currentUserLon) {
                updateWeatherUI(currentUserLat, currentUserLon);
                showNotification("Back to your location! 🏡");
            } else {
                showNotification("I don't know where you are! Ensure location access is allowed.");
            }
        });

        function initApp() {
            // Initialize Icons
            lucide.createIcons();
            
            // Set Date and Greeting
            updateDateTimeAndGreeting();

            // Initial Setup - show spinner immediately
            showLoading("Finding you... 📍");

            // Get User Location
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // Success
                        currentUserLat = position.coords.latitude;
                        currentUserLon = position.coords.longitude;
                        updateWeatherUI(currentUserLat, currentUserLon);
                    },
                    (error) => {
                        // Denied or failed
                        console.warn("Geolocation failed or denied. Using default location.", error);
                        showNotification("Location denied. Showing default place.");
                        updateWeatherUI(DEFAULT_LAT, DEFAULT_LON, null, true);
                    },
                    { timeout: 10000 } 
                );
            } else {
                showNotification("Geolocation is not supported by your browser.");
                updateWeatherUI(DEFAULT_LAT, DEFAULT_LON, null, true);
            }
        }

        // Start the application when the window loads
        window.onload = initApp;
    </script>
</body>
</html>
